<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Atom Orbits (ARCAL Green) -->
  <g stroke="#8CC63F" stroke-width="4.5" fill="none" opacity="0.95">
    <ellipse cx="40" cy="50" rx="36" ry="15" transform="rotate(-30 40 50)" />
    <ellipse cx="40" cy="50" rx="36" ry="15" transform="rotate(30 40 50)" />
    <ellipse cx="40" cy="50" rx="16" ry="38" />
  </g>
  <!-- Radiation Trefoil Center (ARCAL Magenta/Pink) -->
  <g fill="#EF5E95">
    <circle cx="38" cy="46" r="3.5" />
    <path d="M38 41 L34 32 A11 11 0 0 1 42 32 Z" />
    <path d="M34 49 L26 53 A11 11 0 0 1 22 46 Z" />
    <path d="M42 49 L50 53 A11 11 0 0 0 54 46 Z" />
  </g>
  <!-- Ultrasound Monitor (ARCAL Cyan) -->
  <g id="ultrasound">
    <!-- Monitor Base & Cable -->
    <path d="M54 75 Q48 78 48 83 Q48 88 56 88 L68 88 Q72 88 72 84" stroke="#36B0C1" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Transducer / Probe -->
    <rect x="70" y="80" width="10" height="7" rx="3.5" fill="#36B0C1" />
    <rect x="72" y="82" width="6" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <!-- Monitor Frame -->
    <rect x="46" y="48" width="38" height="28" rx="5" fill="#FFFFFF" stroke="#36B0C1" stroke-width="3.5" />
    <!-- Monitor Screen -->
    <rect x="50" y="52" width="30" height="18" rx="2" fill="#4B5563" />
    <!-- Ultrasound Sector / Fan Wave -->
    <path d="M65 54 L57 67 A10 10 0 0 0 73 67 Z" fill="#9CA3AF" opacity="0.6" />
    <path d="M58 64 Q65 61 72 64" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>